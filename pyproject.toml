[project]
name = "denialdojo"
version = "0.1.0"
description = "Counterfactual benchmark for denial-feedback leakage in tool-calling LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Keshav Khandelwal"}]
dependencies = [
  "agentdojo==0.1.35",
  "pydantic>=2.7.1",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
analysis = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denialdojo"]

[tool.hatch.build.targets.wheel.force-include]
"src/denialdojo/data" = "denialdojo/data"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]

