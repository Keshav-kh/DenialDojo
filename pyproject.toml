[project]
name = "denialdojo"
version = "0.1.0"
description = "Counterfactual benchmark for denial-feedback leakage in tool-calling LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Keshav Khandelwal"}]
keywords = [
  "llm-agents",
  "prompt-injection",
  "agent-security",
  "side-channels",
  "benchmark",
  "agentdojo",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "agentdojo==0.1.35",
  "pydantic>=2.7.1",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
analysis = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
]

# PEP 735 dependency group, installed by default under `uv run` / `uv sync`.
# Carries the tooling the analysis/ scripts and their tests need (numpy, scipy)
# alongside pytest and ruff, so `uv run python analysis/analyze.py ...` works
# without naming an extra.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "numpy>=2.0",
  "scipy>=1.13",
]

[build-system]
# hatchling 1.27 is the first release with PEP 639 `license` / `license-files`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ships everything under src/denialdojo, including the suite YAML in data/.
packages = ["src/denialdojo"]

[tool.pytest.ini_options]
# analysis/ holds the standalone statistics scripts and their own tests.
testpaths = ["tests", "analysis"]
pythonpath = ["."]
filterwarnings = [
  # Raised at import time inside google-genai on Python 3.14; not actionable here.
  "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]

